<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capteur de qualité de l'air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Chart.js : la bibliothèque qui dessine les graphes, chargée depuis un CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --fond: #eef2f4; --carte: #ffffff; --bord: #d7e0e5; --texte: #14212b;
    --doux: #5b6b77; --accent: #0b6e8a; --accent-fond: #dcedf3; --grille: #e3eaee;
    --erreur: #b3261e; --ok: #2e9e6b; --bandeau: #0b6e8a;
    --c1: #0b6e8a; --c2: #e0a100; --c3: #7a4fd1;   /* couleurs des courbes */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1a21; --carte: #17252e; --bord: #28394380; --texte: #e8f0f4;
      --doux: #93a6b2; --accent: #5cc3df; --accent-fond: #1d3a46; --grille: #243640;
      --erreur: #ff8a80; --ok: #55d198; --bandeau: #134a5c;
      --c1: #5cc3df; --c2: #f2c14e; --c3: #b79bff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 24px 0 0; line-height: 1.5;
    font-family: "DM Sans", system-ui, sans-serif; color: var(--texte); background: var(--fond);
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Mise en page ---------- */
  .page { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Bandeau de logos, en bas ---------- */
  .bandeau {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 24px 64px; margin-top: 48px; padding: 32px 16px; background: var(--bandeau);   /* pleine largeur */
  }
  .logo { display: block; flex: none; }
  .logo:focus-visible { outline: 2px solid #fff; outline-offset: 6px; border-radius: 4px; }
  .logo img {
    display: block; height: 64px; width: auto; opacity: 0.9; transition: opacity 0.15s;
    filter: brightness(0) invert(1);                 /* logos en blanc sur le bandeau coloré */
  }
  .logo:hover img, .logo:focus-visible img { opacity: 1; }

  /* ---------- En-tête ---------- */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 2.9rem; line-height: 1.1; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--doux); }
  .periodes { display: inline-flex; padding: 4px; gap: 4px; background: var(--carte); border: 1px solid var(--bord); border-radius: 999px; }
  .periodes button {
    font: inherit; font-size: 0.9rem; color: var(--doux); background: none; border: 0;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .periodes button:hover { color: var(--texte); }
  .periodes button[aria-pressed="true"] { background: var(--accent-fond); color: var(--accent); font-weight: 700; }

  /* ---------- Statut ---------- */
  #etat { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; font-size: 0.9rem; color: var(--doux); }
  #etat::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--doux); }
  #etat.ok::before { background: var(--ok); }
  #etat.erreur { color: var(--erreur); }
  #etat.erreur::before { background: var(--erreur); }

  /* ---------- Cartes et tuiles de valeurs ---------- */
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .carte h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }
  .carte h2 span { color: var(--doux); font-weight: 400; }

  #qualite { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--bord); }
  #pastille { width: 14px; height: 14px; margin-top: 7px; border-radius: 50%; background: var(--doux); flex: none; }
  #qualite-texte { font-size: 1.15rem; font-weight: 700; }
  #qualite small { display: block; color: var(--doux); font-size: 0.8rem; }
  #puces { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 2px; font-size: 0.85rem; }
  .puce { display: inline-flex; align-items: center; gap: 6px; }
  .puce i { width: 9px; height: 9px; border-radius: 50%; }

  .valeurs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .valeur { padding: 10px 12px; border-radius: 8px; background: var(--fond); }
  .valeur .nom { font-size: 0.85rem; color: var(--doux); }
  .valeur b { display: block; font-size: 1.7rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .valeur b small { font-size: 0.8rem; font-weight: 400; color: var(--doux); margin-left: 2px; }
  .extremes {
    display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 2px;
    font-size: 0.75rem; color: var(--doux); font-variant-numeric: tabular-nums;
  }

  /* ---------- Graphes ---------- */
  .graphe { position: relative; height: 280px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .duo > .carte { margin: 0; min-width: 0; }
  .duo .graphe { height: 240px; }

  @media (max-width: 760px) {
    .logo img { height: 48px; }
    .duo { grid-template-columns: 1fr; }
    h1 { font-size: 2.1rem; }
    .graphe, .duo .graphe { height: 240px; }
  }
</style>
</head>
<body>
<div class="page">

<main>
  <header>
    <div>
      <h1>Capteur de qualité de l'air</h1>
      <p>Mesures envoyées par la carte du groupe au serveur AirCarto.</p>
    </div>
    <div class="periodes" id="periodes" role="group" aria-label="Période affichée">
      <button type="button" data-periode="-6h" aria-pressed="false">6 h</button>
      <button type="button" data-periode="-24h" aria-pressed="true">24 h</button>
      <button type="button" data-periode="-7d" aria-pressed="false">7 jours</button>
      <button type="button" data-periode="-30d" aria-pressed="false">1 mois</button>
    </div>
  </header>

  <p id="etat" role="status">Chargement…</p>

  <section class="carte">
    <h2>Dernière mesure</h2>
    <div id="qualite" hidden>
      <span id="pastille"></span>
      <div>
        <div id="qualite-texte"></div>
        <div id="puces"></div>
        <small>Niveau le plus élevé parmi PM1, PM2.5 et PM10 (seuils ATMO)</small>
      </div>
    </div>
    <div class="valeurs" id="valeurs"></div>
  </section>

  <section class="carte">
    <h2>Moyenne <span id="titre-moyenne"></span></h2>
    <div class="valeurs" id="moyennes"></div>
  </section>

  <section class="carte" id="carte-pm">
    <h2>Particules <span>µg/m³</span></h2>
    <div class="graphe"><canvas id="graphe-pm"></canvas></div>
  </section>

  <div class="duo">
    <section class="carte" id="carte-temp">
      <h2>Température <span>°C</span></h2>
      <div class="graphe"><canvas id="graphe-temp"></canvas></div>
    </section>
    <section class="carte" id="carte-hum">
      <h2>Humidité <span>%</span></h2>
      <div class="graphe"><canvas id="graphe-hum"></canvas></div>
    </section>
  </div>

  <section class="carte" id="carte-co2">
    <h2>CO₂ <span>ppm</span></h2>
    <div class="graphe"><canvas id="graphe-co2"></canvas></div>
  </section>
</main>

</div>

<script>
// ---------- Réglages : à remplacer ----------
const CLE = "2bdaa7f0a9d6a12e4aa62e4da2049bd8";   // clé du groupe (32 caractères)
const DEVICE_ID = "";      // adresse MAC d'une carte, ou "" pour toutes

// Une moyenne par intervalle selon la période
const MOYENNE = { "-6h": "1m", "-24h": "2m", "-7d": "1h", "-30d": "1h" };
const LIBELLE = { "-6h": "6 h", "-24h": "24 h", "-7d": "7 jours", "-30d": "1 mois" };

// Format des dates selon la période (axes, heures du plus haut / plus bas)
const H = { hour: "2-digit", minute: "2-digit" };
const FORMATS = {
  "-6h": H, "-24h": H,
  "-7d": { weekday: "short", ...H },
  "-30d": { day: "2-digit", month: "2-digit", ...H },
};

// Comment montrer les valeurs manquantes (essaie-les !) :
//   "bandes"     : zones rouges derrière la courbe, courbe coupée
//   "pointilles" : la courbe continue en tirets à travers le trou
//   "croix"      : courbe coupée + points rouges de part et d'autre du trou
//   "coupure"    : courbe simplement coupée
const STYLE_TROUS = "bandes";
const LEGENDE_TROUS = { bandes: "zones rouges", pointilles: "tirets", croix: "points rouges", coupure: "courbe coupée" };
const ROUGE = "#e5484d";

// Axe du temps : même échelle sur toute la période, graduations rondes
const FORMAT_AXE = { "-6h": H, "-24h": H, "-7d": { weekday: "short" }, "-30d": { day: "2-digit", month: "2-digit" } };
const PAS_AXE = { "-6h": 3600e3, "-24h": 4 * 3600e3, "-7d": 86400e3, "-30d": 5 * 86400e3 };
// Durée en ms d'un texte comme "-6h", "2m", "1h" ou "-30d"
const ms = s => parseFloat(s.replace("-", "")) * { m: 60e3, h: 3600e3, d: 86400e3 }[s.slice(-1)];

// Nom affiché, unité et couleur de chaque champ de l'API
const CHAMPS = {
  pm1: ["PM1", "µg/m³"], pm25: ["PM2.5", "µg/m³"], pm10: ["PM10", "µg/m³"],
  temp: ["Température", "°C"], hum: ["Humidité", "%"], co2: ["CO₂", "ppm"],
};
const COULEUR = { pm1: "--c1", pm25: "--c2", pm10: "--c3", temp: "--c2", hum: "--c1", co2: "--c3" };

// Un graphe = un canvas, sa carte, et les champs dessinés dedans
const GRAPHES = [
  { canvas: "graphe-pm",   carte: "carte-pm",   champs: ["pm1", "pm25", "pm10"] },
  { canvas: "graphe-temp", carte: "carte-temp", champs: ["temp"] },
  { canvas: "graphe-hum",  carte: "carte-hum",  champs: ["hum"] },
  { canvas: "graphe-co2",  carte: "carte-co2",  champs: ["co2"] },
];

// Qualité de l'air : seuils de l'indice ATMO (haut de chaque niveau, en µg/m³).
// Il n'existe pas de seuils officiels pour les PM1 : on prend ceux des PM2.5.
const SEUILS = {
  pm1:  [10, 20, 25, 50, 75],
  pm25: [10, 20, 25, 50, 75],
  pm10: [20, 40, 50, 100, 150],
};
const NIVEAUX = [
  ["Bon", "#2e9e6b"], ["Moyen", "#e0c200"], ["Dégradé", "#f08a24"],
  ["Mauvais", "#e5484d"], ["Très mauvais", "#a1244a"], ["Extrêmement mauvais", "#6b2a8a"],
];

const graphes = {};          // les graphes déjà dessinés, à remplacer au rechargement
let periodeCourante = "-24h";

const css = nom => getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
const aValeur = (p, c) => typeof p[c] === "number";
const formater = (c, v) => v.toFixed(c === "co2" ? 0 : 1);   // CO2 sans décimale
const heure = (t, periode) => new Date(t).toLocaleString("fr-FR", FORMATS[periode]);
const niveau = (c, v) => { const i = SEUILS[c].findIndex(s => v <= s); return i === -1 ? 5 : i; };

Chart.defaults.font.family = '"DM Sans", system-ui, sans-serif';

// Ajoute de l'air entre la légende et le graphe
const espaceLegende = {
  id: "espaceLegende",
  beforeInit(chart) {
    if (!chart.legend) return;
    const fit = chart.legend.fit;
    chart.legend.fit = function () { fit.bind(this)(); this.height += 10; };
  },
};

// Dessine une bande rouge derrière la courbe pour chaque trou
const bandesTrous = {
  id: "bandesTrous",
  beforeDatasetsDraw(chart, _args, opt) {
    const { ctx, chartArea: z, scales: { x } } = chart;
    ctx.save();
    ctx.fillStyle = "rgba(229, 72, 77, 0.14)";
    for (const [a, b] of opt.trous || []) {
      const x0 = Math.max(x.getPixelForValue(a), z.left), x1 = Math.min(x.getPixelForValue(b), z.right);
      if (x1 > x0) ctx.fillRect(x0, z.top, x1 - x0, z.bottom - z.top);
    }
    ctx.restore();
  },
};

// Demande les mesures au serveur et renvoie la liste des points.
async function chargerMesures(periode) {
  const params = new URLSearchParams({ key: CLE, start: periode, freq: MOYENNE[periode] });
  if (DEVICE_ID) params.set("device_id", DEVICE_ID);
  const reponse = await fetch("https://api.aircarto.fr/iut-amu/data?" + params);
  const json = await reponse.json();
  if (!json.ok) throw new Error(json.message);   // le serveur explique l'erreur dans "message"
  return json.points;
}

// Instants communs aux courbes d'un graphe, avec une ligne vide dans chaque trou
// (trou = plus d'1,5 intervalle entre deux mesures : il manque au moins une moyenne).
function lignes(points, champs, pas) {
  const rows = []; let prev = null;
  for (const p of points) {
    if (!champs.some(c => aValeur(p, c))) continue;
    const t = new Date(p.time).getTime();
    const trou = prev !== null && t - prev > 1.5 * pas;
    if (trou) { rows[rows.length - 1].bord = true; rows.push({ t: prev + pas, p: null }); }
    rows.push({ t, p, bord: trou });
    prev = t;
  }
  return rows;
}

// Périodes sans mesure [début, fin], y compris avant la 1re mesure et après la dernière
function trous(rows, debut, fin, pas) {
  const b = [debut, ...rows.filter(r => r.p).map(r => r.t), fin], res = [];
  for (let i = 1; i < b.length; i++) {
    const bord = i === 1 || i === b.length - 1;
    if (b[i] - b[i - 1] > (bord ? 2 : 1.5) * pas) res.push([b[i - 1], b[i]]);
  }
  return res;
}

// Dessine (ou redessine) un graphe ; renvoie le nombre de trous repérés.
function dessiner(g, points) {
  const carte = document.getElementById(g.carte);
  carte.hidden = false;                          // visible avant de dessiner, sinon taille nulle
  const pas = ms(MOYENNE[periodeCourante]);
  const fin = Date.now(), debut = fin - ms(periodeCourante);   // l'axe couvre toute la période
  const rows = lignes(points, g.champs, pas);
  const courbes = g.champs
    .filter(c => points.some(p => aValeur(p, c)))   // seulement les champs mesurés
    .map(c => {
      const couleur = css(COULEUR[c]);
      const bord = s => STYLE_TROUS === "croix" && s.raw && s.raw.bord;
      return {
        label: CHAMPS[c][0], champ: c,
        data: rows.map(r => ({ x: r.t, y: r.p && aValeur(r.p, c) ? r.p[c] : null, bord: r.bord })),
        borderColor: couleur, backgroundColor: couleur + "22",
        fill: g.champs.length === 1,             // aire sous la courbe si une seule courbe
        borderWidth: 2, tension: 0.25, pointHoverRadius: 4,
        pointRadius: s => bord(s) ? 4 : 0,
        pointBackgroundColor: s => bord(s) ? ROUGE : couleur,
        pointBorderColor: s => bord(s) ? ROUGE : couleur,
        spanGaps: STYLE_TROUS === "pointilles",
        segment: { borderDash: s => STYLE_TROUS === "pointilles" && (s.p0.skip || s.p1.skip) ? [6, 6] : undefined },
      };
    });

  if (graphes[g.canvas]) { graphes[g.canvas].destroy(); delete graphes[g.canvas]; }
  if (courbes.length === 0) { carte.hidden = true; return 0; }   // ex. pas de CO2 sur un NebuleAir

  const liste = trous(rows, debut, fin, pas);
  const texte = css("--doux");
  graphes[g.canvas] = new Chart(document.getElementById(g.canvas), {
    type: "line",
    data: { datasets: courbes },
    plugins: [espaceLegende, bandesTrous],
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { align: "start", labels: { color: texte, usePointStyle: true, boxWidth: 8, padding: 22 } },
        bandesTrous: { trous: STYLE_TROUS === "bandes" ? liste : [] },
        tooltip: {
          padding: 10, cornerRadius: 8,
          filter: c => c.parsed.y !== null,
          callbacks: {
            title: c => heure(c[0].parsed.x, periodeCourante),
            label: c => `${c.dataset.label} : ${formater(c.dataset.champ, c.parsed.y)} ${CHAMPS[c.dataset.champ][1]}`,
          },
        },
      },
      scales: {
        x: {
          type: "linear", min: debut, max: fin, grid: { display: false },
          ticks: {
            color: texte, maxRotation: 0,
            callback: v => new Date(v).toLocaleString("fr-FR", FORMAT_AXE[periodeCourante]),
          },
          afterBuildTicks(axe) {                 // graduations rondes (heures pleines, jours…)
            const pasAxe = PAS_AXE[periodeCourante], dec = -new Date().getTimezoneOffset() * 60e3;
            const ticks = [];
            for (let t = Math.ceil((axe.min + dec) / pasAxe) * pasAxe - dec; t <= axe.max; t += pasAxe) ticks.push({ value: t });
            axe.ticks = ticks;
          },
        },
        y: { grid: { color: css("--grille") }, ticks: { color: texte }, border: { display: false } },
      },
    },
  });
  return liste.length;
}

// Une tuile "nom + valeur + unité" (+ ligne en plus facultative)
function tuile(c, valeur, extra = "") {
  const [nom, unite] = CHAMPS[c];
  return `<div class="valeur"><span class="nom">${nom}</span>`
       + `<b>${formater(c, valeur)}<small>${unite}</small></b>${extra}</div>`;
}

function afficherDerniere(points) {
  const d = points[points.length - 1];
  document.getElementById("valeurs").innerHTML = Object.keys(CHAMPS)
    .filter(c => aValeur(d, c)).map(c => tuile(c, d[c])).join("");

  // Qualité de l'air : le pire des niveaux PM1 / PM2.5 / PM10
  const bloc = document.getElementById("qualite");
  const niveaux = Object.keys(SEUILS).filter(c => aValeur(d, c)).map(c => ({ c, n: niveau(c, d[c]) }));
  if (niveaux.length === 0) { bloc.hidden = true; return; }
  const pire = Math.max(...niveaux.map(x => x.n));
  document.getElementById("pastille").style.background = NIVEAUX[pire][1];
  document.getElementById("qualite-texte").textContent = "Qualité de l'air : " + NIVEAUX[pire][0];
  document.getElementById("puces").innerHTML = niveaux.map(x =>
    `<span class="puce"><i style="background:${NIVEAUX[x.n][1]}"></i>${CHAMPS[x.c][0]} ${NIVEAUX[x.n][0]}</span>`).join("");
  bloc.hidden = false;
}

// Moyenne de chaque champ sur la période + heure du plus haut (▲) et du plus bas (▼)
function afficherMoyenne(points) {
  document.getElementById("titre-moyenne").textContent = "sur " + LIBELLE[periodeCourante];
  document.getElementById("moyennes").innerHTML = Object.keys(CHAMPS).map(c => {
    const v = points.filter(p => aValeur(p, c));
    if (v.length === 0) return "";
    const moy = v.reduce((s, p) => s + p[c], 0) / v.length;
    const haut = v.reduce((a, p) => p[c] > a[c] ? p : a);
    const bas = v.reduce((a, p) => p[c] < a[c] ? p : a);
    const u = CHAMPS[c][1];
    const extra = `<span class="extremes" title="Plus haut : ${formater(c, haut[c])} ${u} / Plus bas : ${formater(c, bas[c])} ${u}">`
      + `<span aria-label="Heure du plus haut">▲ ${heure(haut.time, periodeCourante)}</span>`
      + `<span aria-label="Heure du plus bas">▼ ${heure(bas.time, periodeCourante)}</span></span>`;
    return tuile(c, moy, extra);
  }).join("");
}

async function rafraichir() {
  const etat = document.getElementById("etat");
  const periode = periodeCourante;
  try {
    const points = await chargerMesures(periode);
    if (periode !== periodeCourante) return;   // période changée pendant la requête
    if (points.length === 0) {
      etat.className = "erreur";
      etat.textContent = "Aucune mesure sur cette période : la carte envoie-t-elle ?";
      return;
    }
    afficherDerniere(points);
    afficherMoyenne(points);
    const nb = Math.max(...GRAPHES.map(g => dessiner(g, points)));   // trous repérés

    const date = new Date(points[points.length - 1].time).toLocaleString("fr-FR");
    etat.className = "ok";
    etat.textContent = `${points.length} points, moyenne sur ${MOYENNE[periode]}. Dernière mesure : ${date}.`
      + (nb ? ` ${nb} interruption${nb > 1 ? "s" : ""} de mesure (${LEGENDE_TROUS[STYLE_TROUS]}).` : "");
  } catch (erreur) {
    etat.className = "erreur";
    etat.textContent = "Erreur : " + erreur.message;
  }
}

document.getElementById("periodes").addEventListener("click", e => {
  const bouton = e.target.closest("button");
  if (!bouton) return;
  periodeCourante = bouton.dataset.periode;
  document.querySelectorAll("#periodes button").forEach(b => b.setAttribute("aria-pressed", b === bouton));
  rafraichir();
});

rafraichir();
setInterval(rafraichir, 2 * 60 * 1000);   // mise à jour toutes les 2 minutes
</script>
